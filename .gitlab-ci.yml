stages:
  - check-supported-os
  - create-dockerfiles
  - build-images
  - test-images
  - download-and-inspect-images

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  # Always allow the pipeline to finish despite new ones have been triggered
  interruptible: false

.supported_os_list: &supported_os_list
  - 'debian10'
  - 'debian11'
  - 'debian12'
  - 'el7'
  - 'el8'
  - 'el9'
  - 'ubuntu2004'
  - 'ubuntu2204'
  - 'ubuntu2404'

# By default, jobs run only when a tag is pushed
.tag_only:
  rules:
    - if: $CI_COMMIT_TAG

check-supported-os:
  stage: check-supported-os
  image: alpine:latest
  # Run also on merge requests, to catch problems with systems.csv before tagging
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  parallel:
    matrix:
      - SUPPORTED_OS: *supported_os_list
  script:
    # create_docker_files.sh reads systems.csv line by line: without a final
    # newline, the last system is skipped
    - |
      if [ -n "$(tail -c 1 systems.csv)" ]; then
        echo "ERROR: systems.csv does not end with a newline"
        exit 1
      fi
    # Ensure there are no mismatches between supported_os_list and systems.csv
    - |
      if ! grep -q "^${SUPPORTED_OS}," systems.csv; then
        echo "ERROR: ${SUPPORTED_OS} is not defined in systems.csv"
        exit 1
      fi
    - echo "${SUPPORTED_OS} is defined in systems.csv"

create-dockerfiles:
  stage: create-dockerfiles
  extends: .tag_only
  image: alpine:latest
  parallel:
    matrix:
      - SUPPORTED_OS: *supported_os_list
  script:
    # bash and wget are dependencies for create_docker_files.sh
    - apk add --no-cache bash wget
    - ./create_docker_files.sh ${SUPPORTED_OS}
  artifacts:
    paths:
      - DockerDir_${SUPPORTED_OS}
    expire_in: 1 days

build-images:
  stage: build-images
  extends: .tag_only
  image:
    # We need the debug image, see the GitLab documentation: https://docs.gitlab.com/ee/ci/docker/using_kaniko.html
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  parallel:
    matrix:
      - SUPPORTED_OS: *supported_os_list
  script:
    - echo "{\"auths\":{\"${DOCKERHUB_REGISTRY}\":{\"auth\":\"${DOCKERHUB_AUTH}\"}}}" > /kaniko/.docker/config.json
    # We push to the container registry and Docker Hub
    # In addition, we push the "untagged" images to automatically create the "latest" tag
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/DockerDir_${SUPPORTED_OS}"
      --dockerfile "${CI_PROJECT_DIR}/DockerDir_${SUPPORTED_OS}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/belle2-base-${SUPPORTED_OS}:${CI_COMMIT_TAG}"
      --destination "${CI_REGISTRY_IMAGE}/belle2-base-${SUPPORTED_OS}"
      --destination "${DOCKERHUB_ORGANIZATION}/belle2-base-${SUPPORTED_OS}:${CI_COMMIT_TAG}"
      --destination "${DOCKERHUB_ORGANIZATION}/belle2-base-${SUPPORTED_OS}"
  dependencies:
    - create-dockerfiles

test-images:
  stage: test-images
  extends: .tag_only
  # Here we take the images from the GitLab container registry for running the test
  # We will check the integrity of the Docker Hub images in the following stage
  image: $CI_REGISTRY_IMAGE/belle2-base-$SUPPORTED_OS:$CI_COMMIT_TAG
  parallel:
    matrix:
      - SUPPORTED_OS: *supported_os_list
  script:
    - ./tests/test.sh

download-and-inspect-images:
  stage: download-and-inspect-images
  extends: .tag_only
  image: alpine:latest
  parallel:
    matrix:
      - SUPPORTED_OS: *supported_os_list
  script:
    # Check if we can download the images from Docker Hub with both apptainer and skopeo
    - apk add apptainer skopeo
    - apptainer build belle2-base-${SUPPORTED_OS}-${CI_COMMIT_TAG}.sif docker://${DOCKERHUB_ORGANIZATION}/belle2-base-${SUPPORTED_OS}:${CI_COMMIT_TAG}
    - skopeo copy docker://${DOCKERHUB_ORGANIZATION}/belle2-base-${SUPPORTED_OS}:${CI_COMMIT_TAG} docker-archive:belle2-base-${SUPPORTED_OS}-${CI_COMMIT_TAG}.tar
    # And inspect the images: we want to see if skopeo crashes or not
    - skopeo inspect docker://${DOCKERHUB_ORGANIZATION}/belle2-base-${SUPPORTED_OS}:${CI_COMMIT_TAG}
    - skopeo inspect docker-archive:belle2-base-${SUPPORTED_OS}-${CI_COMMIT_TAG}.tar